# Ping Streamlit Cloud so the app stays warm (reduces cold-start disconnects).
name: Keepalive Streamlit

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Streamlit app
        run: |
          set -e
          URL="${{ vars.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://tim-team-system.streamlit.app/"
          fi
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/keepalive_body.txt -w "%{http_code}" \
              -A "TIM-TEAM-Keepalive/1.0" \
              --connect-timeout 20 \
              --max-time 60 \
              "$URL" || true)
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "303" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Keepalive soft-failed (app may be sleeping); next run will retry."
          exit 0
