{% extends "base.html" %}
{% block body %}
<div class="wrap">
  <div class="topbar">
    <div class="brand">QR CODES</div>
    <a class="pill" href="/staff/board?pin={{ pin }}">← Board</a>
  </div>
  <div class="hero">
    <h1>Seat QR codes</h1>
    <p>Print for Tables 1–5, Bar 1–5, Terrace 1–8. Guests scan to order.</p>
  </div>
  <div class="qr-grid">
    {% for t in tables %}
    <div class="qr-card">
      <strong>{{ t.label }}</strong>
      <div><img src="/qr/{{ t.code }}.png" alt="{{ t.code }}" /></div>
      <small>{{ base }}/t/{{ t.code }}</small>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
