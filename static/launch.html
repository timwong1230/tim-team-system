<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>TIM TEAM</title>
  <!--
    Launch page for iPhone Add to Home Screen.
    Icons MUST be absolute public HTTPS (CDN) — iOS fetches them without cookies.
    Do not host this file on jsDelivr (serves HTML as text/plain).
    Prefer GitHub Pages or Streamlit /app/static/launch.html (app must be link-public).
  -->
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180"
        href="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32"
        href="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/app_icon_32.png" />
  <link rel="icon" type="image/png" sizes="192x192"
        href="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/app_icon_192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TIM TEAM" />
  <meta name="application-name" content="TIM TEAM" />
  <meta name="theme-color" content="#0A0D14" />
  <link rel="manifest"
        href="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/site.webmanifest" />
  <style>
    :root {
      --bg: #0A0D14;
      --gold: #C5A028;
      --ink: #F3F1EB;
      --muted: #9CA3AF;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: radial-gradient(900px 420px at 50% -10%, #1A2230 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    main {
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
      text-align: center;
      gap: 18px;
    }
    img.icon {
      width: 112px; height: 112px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 8px 0 0;
      font-size: 1.55rem; letter-spacing: 0.18em;
      font-weight: 700;
    }
    p {
      margin: 0; max-width: 20rem;
      color: var(--muted); font-size: 0.95rem; line-height: 1.45;
    }
    a.cta {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 10px; min-height: 52px; min-width: 220px;
      padding: 0 22px; border-radius: 14px;
      background: linear-gradient(135deg, #D4AF37, #B38F21);
      color: #1C2430; font-weight: 700; font-size: 1.05rem;
      text-decoration: none;
    }
    .hint {
      margin-top: 8px; font-size: 0.82rem; color: var(--muted);
      max-width: 22rem; line-height: 1.4;
    }
    .hint strong { color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img class="icon"
         src="https://cdn.jsdelivr.net/gh/timwong1230/tim-team-system@main/static/apple-touch-icon.png"
         width="180" height="180" alt="ACE TEAM" />
    <h1>TIM TEAM</h1>
    <p>保險團隊工作台。加到主畫面請用本頁（先見 ACE TEAM 圖示），唔好直接 bookmark Streamlit 首頁。</p>
    <a class="cta" id="open" href="https://tim-team-system.streamlit.app/">進入 App</a>
    <p class="hint">加主畫面：Safari 分享 → <strong>加到主畫面</strong>。之後撳圖示會開啟本頁，再自動／撳「進入 App」。</p>
  </main>
  <script>
    (function () {
      var APP = "https://tim-team-system.streamlit.app/";
      var standalone = (window.navigator.standalone === true)
        || window.matchMedia("(display-mode: standalone)").matches;
      if (standalone) {
        window.location.replace(APP);
      }
    })();
  </script>
</body>
</html>
