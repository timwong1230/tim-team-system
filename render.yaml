# Polar Lounge QR order — Render Blueprint
# Deploy: https://render.com/deploy?repo=https://github.com/timwong1230/tim-team-system

services:
  - type: web
    name: polar-order
    runtime: docker
    rootDir: polar-order
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: polar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: POLAR_DATA_DIR
        value: /data
      - key: POLAR_STAFF_PIN
        sync: false
      - key: PORT
        value: "8080"
